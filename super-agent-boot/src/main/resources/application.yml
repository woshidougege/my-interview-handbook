# 公共配置 - 所有环境通用
server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: super-agent
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}  # 默认使用开发环境
  
  # 数据源公共配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    
    # Druid 连接池配置（所有环境通用）
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      
      # 统计过滤器
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 2000

  # Flyway配置 - 直接使用项目数据源
  flyway:
    enabled: false  # 默认关闭，各环境按需开启
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

# MyBatis Flex 配置
mybatis-flex:
  mapper-locations: classpath*:/mapper/*.xml
  type-aliases-package: com.noah.superagent.dao.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

# db-scheduler 配置 - 暂时禁用排查问题
db-scheduler:
  enabled: false
  table-name: scheduled_tasks
  immediate-execution-enabled: false
  heartbeat-interval: 5m
  polling-interval: 10s
  polling-limit: 3
  shutdown-max-wait: 30m
  executor-service:
    core-pool-size: 2
    max-pool-size: 4

# Knife4j 文档配置
knife4j:
  enable: true
  openapi:
    title: Super Agent API
    description: 用户管理和计费平台接口文档
    version: ${revision:1.0.0}
    concat-contact: true
    contact:
      name: 开发团队
      email: dev@noah.com
    license: Apache 2.0
    license-url: https://www.apache.org/licenses/LICENSE-2.0
  setting:
    language: zh_cn
    enable-version: true
    enable-dynamic-parameter: true

# 默认日志配置
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
