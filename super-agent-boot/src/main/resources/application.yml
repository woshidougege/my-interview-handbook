# ========== Super Agent 主配置文件 ==========
# 所有环境统一配置，通过环境变量区分差异

# 服务器配置
server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/super-agent}
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  # Undertow容器配置（高性能Web服务器）
  undertow:
    # 线程配置（根据服务器规格调整）
    threads:
      worker: ${SERVER_UNDERTOW_WORKER_THREADS:8}
      io: ${SERVER_UNDERTOW_IO_THREADS:4}
    # 缓冲区配置（调整为更适合流式传输的大小）
    buffer-size: ${SERVER_UNDERTOW_BUFFER_SIZE:16384}
    # 使用直接内存提升性能
    direct-buffers: ${SERVER_UNDERTOW_DIRECT_BUFFERS:true}
    # 最大HTTP POST请求大小
    max-http-post-size: ${SERVER_UNDERTOW_MAX_HTTP_POST_SIZE:10MB}

# Spring配置
spring:
  application:
    name: super-agent
  
  # PID文件管理（Spring Boot自动配置方式）
  pid:
    file: ${PID_FILE_PATH:pid/super-agent.pid}
    fail-on-write-error: true
  
  # 静态文件配置 - 支持临时文件发布
  web:
    resources:
      static-locations: file:temp/public/
  mvc:
    static-path-pattern: /files/**
  
  # 配置文件导入（按功能模块拆分）
  config:
    import:
      # === 基础框架配置 ===
      - classpath:application-spring.yml      # Spring Framework配置
      - classpath:application-cors.yml        # CORS跨域配置
      - classpath:application-datasource.yml  # 数据源配置
      - classpath:application-mybatis.yml     # MyBatis-Flex配置
      - classpath:application-flyway.yml      # Flyway配置
      - classpath:application-logging.yml     # 日志配置
      - classpath:application-api-docs.yml    # API文档配置
      - classpath:application-async.yml       # 异步处理配置
      # === 业务功能配置 ===
      - classpath:application-billing.yml     # 计费系统配置
      - classpath:application-payment.yml     # 支付系统配置
      - classpath:application-plans.yml       # 套餐配置
      - classpath:application-scheduler.yml   # 任务调度配置
      - classpath:application-sso.yml         # 单点登录配置
      - classpath:application-ai.yml          # AI服务配置

# 应用信息配置
info:
  app:
    name: "@project.name@"
    description: "@project.description@"
    version: "@project.version@"
    encoding: "@project.build.sourceEncoding@"
    java:
      version: "@java.version@"
    build:
      timestamp: "@maven.build.timestamp@"

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"
      base-path: "/actuator"
  endpoint:
    health:
      show-details: "when-authorized"
  info:
    env:
      enabled: true

# Kunlun平台配置
kunlun:
  # 能力中心编码配置
  ability-codes:
    defaultCode: "18961714392032"
  # 实体编码配置
  entity-codes:
    defaultCode: "ENTITY_test_pp_dispatch"
  # 聊天历史相关配置
  chat-history:
    url: ${KUNLUN_CHAT_HISTORY_DETAIL_URL:http://192.168.1.137:7667/kunlun/chatHistory/getById}
    list-url: ${KUNLUN_CHAT_HISTORY_LIST_URL:http://192.168.1.137:7667/kunlun/chatHistory/list}
    delete-url: ${KUNLUN_CHAT_HISTORY_DELETE_URL:http://192.168.1.137:7667/kunlun/chatHistory/deleteById}
  # 规划智能体改造相关配置
  a2a:
    # 会话执行接口
    session-execution:
      url: ${KUNLUN_A2A_SESSION_EXECUTION_URL:http://192.168.1.66:8000/kunlun/a2a/api/{abilityCode}/entity/{entityCode}/userid/{userId}/satoken/{satoken}}
    # 补充信息接口
    supplement-info:
      url: ${KUNLUN_A2A_SUPPLEMENT_INFO_URL:http://192.168.1.66:8000/kunlun/a2a/api/{abilityCode}/entity/{entityCode}/userid/{userId}/satoken/{satoken}}
    # A2AProtocolProxy实体编码（用于补充信息）
    protocol-proxy:
      entity-code: ${KUNLUN_A2A_PROTOCOL_PROXY_ENTITY_CODE:ENTITY_EXCEL_ANAYSIS}
  # 注册回调配置
  registration:
    callback-url: ${REGISTRATION_CALLBACK_URL:http://192.168.1.66:8000/kl-dt-gateway/user/generatePlanAgentAndDocs}
  # 文档库配置
  file-repository:
    upload-path: ${FILE_REPOSITORY_UPLOAD_PATH:http://192.168.1.66:8000/kl-dt-gateway/gateway/twin/FileRepository/stream/put}
    list-object-names-path: ${FILE_REPOSITORY_LIST_OBJECT_NAMES_PATH:http://192.168.1.66:8000/kl-dt-gateway/gateway/{abilityCode}/twin/FileRepository/entity/{entityCode}/service/listObjectNames}
    get-object-url-path: ${FILE_REPOSITORY_GET_OBJECT_URL_PATH:http://192.168.1.66:8000/kl-dt-gateway/gateway/{abilityCode}/twin/FileRepository/entity/{entityCode}/service/getObjectURL}