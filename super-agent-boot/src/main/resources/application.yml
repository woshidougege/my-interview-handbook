# 公共配置 - 所有环境通用
server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /super-agent
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  # Undertow容器优化配置 - 高性能Web服务器
  undertow:
    # 工作线程数（建议为CPU核心数 * 2）
    threads:
      worker: 8
      io: 4
    # 缓冲区配置
    buffer-size: 1024
    buffers-per-region: 1024
    # 使用直接内存提升性能
    direct-buffers: true
    # 最大HTTP POST请求大小
    max-http-post-size: 10MB

spring:
  application:
    name: super-agent
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}  # 默认使用开发环境
    include: sso,scheduler,payment  # 引入SSO配置、调度器配置和支付配置
  
  # 修复Spring Boot 2.7.x与Knife4j兼容性问题
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  
  # 静态资源配置
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        period: 31536000  # 1年缓存
      chain:
        strategy:
          content:
            enabled: true
            paths: "/**"
        cache: true
  
  # 数据源公共配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    
    # Druid 连接池配置（所有环境通用）
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      
      # 统计过滤器
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 2000
          merge-sql: true
        wall:
          enabled: true
          config:
            multi-statement-allow: true

  # Flyway配置 - 直接使用项目数据源
  flyway:
    enabled: false  # 默认关闭，各环境按需开启
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false
    table: flyway_schema_history
    sql-migration-prefix: V
    sql-migration-separator: __
    sql-migration-suffixes: .sql
    encoding: UTF-8
    placeholder-replacement: true
    clean-disabled: true

# MyBatis Flex 配置
mybatis-flex:
  mapper-locations: classpath*:/mapper/*.xml
  type-aliases-package: com.noah.superagent.dao.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

# SpringDoc OpenAPI 3 配置（官方推荐）
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    # 自动按@Tag分组显示
    tags-sorter: alpha
    operations-sorter: alpha
    # 默认展开接口详情
    doc-expansion: list
    # 显示请求头
    display-request-duration: true
  # 只扫描业务Controller包，排除系统Controller
  packages-to-scan: com.noah.superagent.controller
  # 只匹配API路径
  paths-to-match: /api/**

# 默认日志配置
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# 异步处理配置
async:
  # 通用异步线程池配置
  general:
    core-pool-size: ${ASYNC_GENERAL_CORE_POOL_SIZE:2}
    max-pool-size: ${ASYNC_GENERAL_MAX_POOL_SIZE:6}
    queue-capacity: ${ASYNC_GENERAL_QUEUE_CAPACITY:200}
    keep-alive-seconds: ${ASYNC_GENERAL_KEEP_ALIVE:60}
    thread-name-prefix: "async-"