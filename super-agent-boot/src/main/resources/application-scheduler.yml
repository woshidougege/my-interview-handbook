# DB-Scheduler 定时任务配置
# 每日积分发放任务专用配置文件

# 每日积分管理任务配置（合并了清理和补发功能）
daily-credits-management:
  # CRON表达式: 每天凌晨00:00:00执行
  # 格式: 秒 分 时 日 月 星期
  cron: "0 0 0 * * ?"
  enabled: true
  description: "每日积分管理任务：先清理过期的每日积分，再为活跃用户补发新的每日积分"
  # 功能开关
  cleanup-enabled: true    # 是否启用积分清理功能
  grant-enabled: true      # 是否启用积分补发功能

db-scheduler:
  # 启用调度器
  enabled: true
  
  # 数据库表名（必须与数据库迁移脚本中的表名一致）
  table-name: t_scheduled_task
  
  # 线程池配置
  threads: 5
  
  # 轮询间隔（检查待执行任务的频率）
  polling-interval: 30s
  
  # 心跳间隔（集群环境下的心跳检测）
  heartbeat-interval: 5m
  
  # 是否启用立即执行
  immediate-execution-enabled: false
  
  # 轮询限制
  polling-limit: 3
  
  # 关闭时最大等待时间
  shutdown-max-wait: 30m
  
  # 删除未解析任务的时间
  delete-unresolved-after: 14d
  
  # 日志配置
  failure-logger-level: WARN
  failure-logger-log-stack-trace: true

# DB Scheduler UI 配置
# 注释掉：db-scheduler-ui 需要JDK17+和Spring Boot 3.3+，不兼容当前环境
# db-scheduler-ui:
#   history: true
#   log-limit: 1000
#   task-data: true
#   read-only: false

# DB Scheduler Log 配置
db-scheduler-log:
  # 启用日志记录
  enabled: true
  
  # 使用以t开头的表名（符合项目表命名规范）
  table-name: t_scheduled_execution_logs