super-agent:
  plans:
    # 全局年付优惠比例
    yearly-discount-rate: 0.17
    
    # 套餐配置列表（国际化版本 - 文案通过key从国际化文件获取）
    subscription-plans:
      # 免费版
      - id: "1"
        code: "FREE"
        # name 和 description 从国际化文件获取: plan.FREE.name, plan.FREE.description
        monthly-original-price: 0
        yearly-original-price: 0
        monthly-discounted-price: 0
        yearly-discounted-price: 0
        monthly-savings: 0
        yearly-savings: 0
        validity-days: 0    # 0表示永久有效
        daily-refresh-credits: 300    # 每日刷新积分数量
        sort-order: 1
        is-recommended: false
        enabled: true
        features:
          - key: "daily_credits"
            highlight: true
          - key: "access_chat"
            highlight: false
          - key: "public_avatar_trial"
            highlight: false
            
      # 基础版
      - id: "2"
        code: "BASIC"
        # name 和 description 从国际化文件获取: plan.BASIC.name, plan.BASIC.description
        monthly-original-price: 39
        yearly-original-price: 468
        monthly-discounted-price: -1    # -1=自动17%优惠
        yearly-discounted-price: -1
        monthly-savings: -1
        yearly-savings: -1
        validity-days: 30
        daily-refresh-credits: 1900
        sort-order: 2
        is-recommended: true
        enabled: true
        features:
          - key: "initial_credits"
            highlight: false
          - key: "daily_credits"
            highlight: false
          - key: "access_chat"
            highlight: false
          - key: "public_avatar"
            highlight: false
          - key: "slide_maker"
            highlight: false
          - key: "web_dev"
            highlight: false
          - key: "data_analysis"
            highlight: false
          - key: "media_gen"
            highlight: false
            
      # 高级版
      - id: "3"
        code: "PREMIUM"
        # name 和 description 从国际化文件获取: plan.PREMIUM.name, plan.PREMIUM.description
        monthly-original-price: 199
        yearly-original-price: 2388
        monthly-discounted-price: -1
        yearly-discounted-price: -1
        monthly-savings: -1
        yearly-savings: -1
        validity-days: 30
        daily-refresh-credits: 5900
        sort-order: 3
        is-recommended: false
        enabled: true
        features:
          - key: "initial_credits"
            highlight: false
          - key: "daily_credits"
            highlight: false
          - key: "access_chat"
            highlight: false
          - key: "exclusive_avatar"
            highlight: true
          - key: "slide_maker"
            highlight: false
          - key: "web_dev"
            highlight: false
          - key: "data_analysis"
            highlight: false
          - key: "media_gen"
            highlight: false
          - key: "pc_control"
            highlight: true
            
      # 购买积分套餐
      - id: "100"
        code: "CREDIT_PACK"
        # name 和 description 从国际化文件获取: plan.CREDIT_PACK.name, plan.CREDIT_PACK.description
        monthly-original-price: 59
        yearly-original-price: 59
        monthly-discounted-price: 59
        yearly-discounted-price: 59
        monthly-savings: 0
        yearly-savings: 0
        credits-amount: 10000
        validity-days: 0    # 0表示永久有效
        sort-order: 4
        is-recommended: false
        enabled: true
        features:
          - key: "ppt_gen"
            highlight: false
          - key: "report_gen"
            highlight: false
          - key: "website_gen"
            highlight: false
          - key: "image_gen"
            highlight: false
          - key: "table_analysis"
            highlight: false
            
      # 开发者神仙版（测试专用）
      - id: "5"
        code: "DEVELOPER_GOD"
        # name 和 description 从国际化文件获取: plan.DEVELOPER_GOD.name, plan.DEVELOPER_GOD.description
        monthly-original-price: 0.01
        yearly-original-price: 0.01
        monthly-discounted-price: 0.01
        yearly-discounted-price: 0.01
        monthly-savings: 0
        yearly-savings: 0
        validity-days: 36500    # 100年
        daily-refresh-credits: 999999
        sort-order: 0
        is-recommended: true
        enabled: true
        features:
          - key: "dev_bonus"
            highlight: true
          - key: "massive_credits"
            highlight: true
          - key: "daily_refresh"
            highlight: true
          - key: "unlimited_ai"
            highlight: true
          - key: "super_avatar"
            highlight: true
          - key: "priority_model"
            highlight: true
          - key: "unlimited_concurrent"
            highlight: true
          - key: "super_speed"
            highlight: true
          - key: "debug_tools"
            highlight: true
          - key: "unlimited_pc"
            highlight: true
          - key: "unlimited_data"
            highlight: true
          - key: "unlimited_media"
            highlight: true
          - key: "unlimited_web"
