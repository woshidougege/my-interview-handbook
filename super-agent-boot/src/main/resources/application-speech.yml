super-agent:
  speech-recognition:
    # 语音识别模型 - 使用fun-asr模型
    model: fun-asr
    
    # 默认采样率（Hz）
    default-sample-rate: 16000
    
    # 支持的音频格式
    supported-formats:
      - pcm
      - wav
      - mp3
      - opus
      - speex
      - aac
      - amr
    
    # 支持的源语言（识别语言）
    supported-source-languages:
      - auto    # 自动检测
      - zh      # 中文
      - en      # 英文
      - ja      # 日语
      - yue     # 粤语
      - ko      # 韩语
      - de      # 德语
      - fr      # 法语
      - ru      # 俄语
      - it      # 意大利语
      - es      # 西班牙语
    
    # 支持的翻译目标语言
    supported-translation-languages:
      - zh      # 中文
      - en      # 英文
      - ja      # 日语
      - ko      # 韩语
    
    # 语言代码到显示名称的映射
    language-names:
      auto: "自动检测"
      zh: "中文"
      en: "英文"
      ja: "日语"
      yue: "粤语"
      ko: "韩语"
      de: "德语"
      fr: "法语"
      ru: "俄语"
      it: "意大利语"
      es: "西班牙语"
    
    # 音频格式到显示名称的映射
    format-names:
      pcm: "PCM"
      wav: "WAV"
      mp3: "MP3"
      opus: "Opus"
      speex: "Speex"
      aac: "AAC"
      amr: "AMR"
    
    # 音频格式说明
    format-descriptions:
      pcm: "未压缩的原始音频数据"
      wav: "WAV格式，必须为PCM编码"
      mp3: "MP3压缩音频格式"
      opus: "Opus格式，必须使用Ogg封装"
      speex: "Speex格式，必须使用Ogg封装"
      aac: "AAC压缩音频格式"
      amr: "AMR格式，仅支持AMR-NB类型"
    
    # 默认配置
    defaults:
      # 是否启用转录功能
      transcription-enabled: true
      # 是否启用翻译功能
      translation-enabled: false
      # 默认源语言
      source-language: auto
      # VAD断句静音时长阈值（毫秒）
      max-end-silence: 800
      # 最小静音时长（毫秒）
      min-end-silence: 200
      # 最大静音时长限制（毫秒）
      max-end-silence-limit: 6000
    
    # 高级配置
    advanced:
      # 是否启用热词功能
      hot-word-enabled: false
      # 是否启用置信度返回
      confidence-enabled: false
      # 是否启用时间戳
      timestamp-enabled: false
    
    # 参数限制配置
    limits:
      # 最小采样率（Hz）
      min-sample-rate: 16000
      # 最大采样率（Hz）
      max-sample-rate: 48000
      # 最大文件大小（MB）
      max-file-size-mb: 100
      # 最大录音时长（秒）
      max-recording-duration-seconds: 300
