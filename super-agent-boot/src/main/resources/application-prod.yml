# 生产环境配置
spring:
  # 生产环境数据源配置
  datasource:
    url: ${DB_URL:jdbc:mysql://prod-db-host:3306/super_agent?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8}
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD}  # 生产环境必须提供密码
    
    # 生产环境连接池优化
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 50
      max-wait: 30000
      
      # 生产环境关闭监控页面
      stat-view-servlet:
        enabled: false
        
      # 保留统计但关闭控制台输出
      filter:
        stat:
          log-slow-sql: true
          slow-sql-millis: 5000  # 生产环境慢SQL阈值提高
  
  # 生产环境禁用Flyway自动执行
  flyway:
    enabled: false

# MyBatis Flex 生产环境配置
mybatis-flex:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl  # 生产环境不打印SQL

# Knife4j 生产环境配置
knife4j:
  enable: ${API_DOC_ENABLE:false}  # 生产环境默认关闭API文档

# db-scheduler 生产环境配置
db-scheduler:
  executor-service:
    core-pool-size: 4
    max-pool-size: 8

# 生产环境日志配置
logging:
  level:
    root: WARN
    com.noah.superagent: INFO
    com.mybatis: WARN
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.flywaydb: INFO
    com.alibaba.druid: WARN
  file:
    name: logs/super-agent.log
    max-size: 100MB
    max-history: 30
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
