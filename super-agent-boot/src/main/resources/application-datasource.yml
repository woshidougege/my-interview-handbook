# ========== 数据源配置主文件 ==========
# 通过环境变量 DB_TYPE 来切换数据库类型：mysql 或 postgresql（默认）
# 
# 使用方式：
# 1. 启动时指定：java -jar app.jar --spring.profiles.include=datasource-postgresql
# 2. 环境变量：export DB_TYPE=postgresql 或 export DB_TYPE=mysql

spring:
  profiles:
    # 默认使用PostgreSQL配置
    include: datasource-${DB_TYPE:postgresql}

  # ========== 公共数据源配置 ==========
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    
    # Druid 连接池公共配置
    druid:
      # 连接池配置
      initial-size: ${DB_INITIAL_SIZE:5}
      min-idle: ${DB_MIN_IDLE:5}
      max-active: ${DB_MAX_ACTIVE:20}
      max-wait: ${DB_MAX_WAIT:60000}
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      
      # 统计过滤器
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 2000
          merge-sql: true
        wall:
          enabled: true
          config:
            multi-statement-allow: true
      
      # 监控配置
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: false
        login-username: ${DRUID_USERNAME:admin}
        login-password: ${DRUID_PASSWORD:123456}
        allow: ${DRUID_ALLOW:127.0.0.1}
        deny: ${DRUID_DENY:}
      
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"

# 数据源特殊配置由单独的profile文件提供：
# - application-datasource-mysql.yml      (MySQL特殊配置)
# - application-datasource-postgresql.yml (PostgreSQL特殊配置)
