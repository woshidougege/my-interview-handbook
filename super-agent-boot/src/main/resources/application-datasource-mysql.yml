# ========== MySQL 数据源特殊配置 ==========
spring:
  # MySQL 特殊数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://192.168.1.54:32233/super_agent?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&allowMultiQueries=true&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    
    # MySQL 特殊的 Druid 配置
    druid:
      validation-query: SELECT 1

  # MySQL 特殊的 Flyway 配置
  flyway:
    # 默认模式
    default-schema: ${DB_NAME:super_agent}
    # 模式列表
    schemas: []
    # MySQL 特有的占位符
    placeholders:
      database_name: ${DB_NAME:super_agent}
      charset: utf8mb4
      collation: utf8mb4_unicode_ci
