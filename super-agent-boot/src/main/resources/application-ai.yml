# ========== AI服务配置 ==========
super-agent:
  ai:
    # 阿里云百炼大模型配置
    alibaba-dashscope:
      enabled: ${AI_ALIBABA_DASHSCOPE_ENABLED:true}
      api-key: ${AI_ALIBABA_DASHSCOPE_API_KEY:sk-461c4edfdd274e12b2b807cf3b6de44e}
      
      # 标题生成模型配置
      title-generation:
        model: ${AI_TITLE_GENERATION_MODEL:qwen-plus}
        max-tokens: ${AI_TITLE_GENERATION_MAX_TOKENS:50}
        temperature: ${AI_TITLE_GENERATION_TEMPERATURE:0.7}
        # 系统角色提示词 - 完整的指令和要求
        system-prompt: |
          为用户的问题生成简洁的对话标题。要求：

          - 准确提取问题的核心主题或意图
          - 控制在3-8个词，简洁明了
          - 使用具体、专业的表述
          - 避免"如何"、"关于"、"问题"等泛化词汇
          - 突出具体的主题或行动
          - 便于分类和检索

          只返回标题文本。
        
      # 语音识别配置 - 使用本地FunASR
      speech-recognition:
        funasr:
          server-url: ${FUNASR_SERVER_URL:http://192.168.1.136:5000}
          timeout: ${FUNASR_TIMEOUT:0}  # 超时时间(秒)：0=无限制，建议根据音频长度设置，如3600(1小时)
        
        # 文本纠错配置 - 使用AI大模型纠正长音频识别错误
        text-correction:
          enabled: ${SPEECH_TEXT_CORRECTION_ENABLED:true}  # 是否启用文本纠错
          # 触发条件
          min-audio-duration: ${SPEECH_TEXT_CORRECTION_MIN_DURATION:300}  # 音频最小时长(秒)，超过此时长才纠错，默认5分钟
          min-text-length: ${SPEECH_TEXT_CORRECTION_MIN_LENGTH:500}  # 文本最小长度(字符)，超过此长度才纠错，默认500字符
          # AI模型配置
          model: ${SPEECH_TEXT_CORRECTION_MODEL:qwen3-max}  # 使用的纠错模型
          max-tokens: ${SPEECH_TEXT_CORRECTION_MAX_TOKENS:20000}  # 最大token数，支持长文本纠错
          temperature: ${SPEECH_TEXT_CORRECTION_TEMPERATURE:0.3}  # 较低温度保证准确性
          # 纠错提示词模板
          system-prompt: |
            直接纠正语音识别文本中的错误：同音字、标点符号、语法错误。保持原意和语气。不要添加任何说明、注释、格式化标记或前言后语。直接输出纯净的纠正文本。
