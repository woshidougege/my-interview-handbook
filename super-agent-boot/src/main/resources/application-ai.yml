# ========== AI服务配置 ==========
super-agent:
  ai:
    # 阿里云百炼大模型配置
    alibaba-dashscope:
      enabled: ${AI_ALIBABA_DASHSCOPE_ENABLED:true}
      api-key: ${AI_ALIBABA_DASHSCOPE_API_KEY:sk-461c4edfdd274e12b2b807cf3b6de44e}
      
      # 标题生成模型配置
      title-generation:
        model: ${AI_TITLE_GENERATION_MODEL:qwen-plus}
        max-tokens: ${AI_TITLE_GENERATION_MAX_TOKENS:50}
        temperature: ${AI_TITLE_GENERATION_TEMPERATURE:0.7}
        # 系统角色提示词 - 完整的指令和要求
        system-prompt: |
          为用户的问题生成简洁的对话标题。要求：

          - 准确提取问题的核心主题或意图
          - 控制在3-8个词，简洁明了
          - 使用具体、专业的表述
          - 避免"如何"、"关于"、"问题"等泛化词汇
          - 突出具体的主题或行动
          - 便于分类和检索

          只返回标题文本。
        
      # 语音识别配置
      speech-recognition:
        model: ${AI_SPEECH_RECOGNITION_MODEL:gummy-realtime-v1}
        sample-rate: ${AI_SPEECH_RECOGNITION_SAMPLE_RATE:16000}
        audio-format: ${AI_SPEECH_RECOGNITION_FORMAT:wav}
        language-hints: ${AI_SPEECH_RECOGNITION_LANGUAGE:zh}
        enable-punctuation: ${AI_SPEECH_RECOGNITION_PUNCTUATION:true}
        enable-itn: ${AI_SPEECH_RECOGNITION_ITN:true}
        heartbeat: ${AI_SPEECH_RECOGNITION_HEARTBEAT:true}
