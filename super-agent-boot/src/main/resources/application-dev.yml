# 开发环境配置
spring:
  # 开发环境数据源
  datasource:
    url: jdbc:mysql://192.168.1.54:32233/super_agent?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    
    # 开发环境Druid监控
    druid:
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: ${DRUID_USERNAME:admin}
        login-password: ${DRUID_PASSWORD:admin}
        allow: 127.0.0.1
        reset-enable: false
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*,/error"
  
  # 开发环境自动执行数据库迁移
  flyway:
    enabled: true

# MyBatis Flex 开发环境配置
mybatis-flex:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开发环境打印SQL

# 开发环境日志配置 - 详细日志
logging:
  level:
    com.noah.superagent: DEBUG
    com.mybatis: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG
    com.alibaba.druid: DEBUG
  file:
    name: logs/super-agent-dev.log
