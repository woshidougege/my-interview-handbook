# ========== CORS跨域配置主文件 ==========
# 通过环境变量 CORS_ENV 来切换CORS配置：test 或 prod（默认test）
# 
# 使用方式：
# 1. 启动时指定：java -jar app.jar --spring.profiles.include=cors-test
# 2. 环境变量：export CORS_ENV=test 或 export CORS_ENV=prod

spring:
  profiles:
    # 默认使用测试环境CORS配置
    include: cors-${CORS_ENV:test}

# CORS配置由单独的profile文件提供：
# - application-cors-test.yml (测试环境配置)
# - application-cors-prod.yml (生产环境配置)
