# CORS跨域配置
super-agent:
  cors:
    # 是否启用CORS跨域支持
    # 开发环境建议: true（前后端分离开发）
    # 生产环境建议: false（nginx代理，同域访问）
    enabled: ${CORS_ENABLED:true}
    
    # 允许的源地址列表（仅在enabled=true时生效）
    # 开发环境示例: http://localhost:3000,http://127.0.0.1:3000
    # 生产环境: 不配置或留空
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
    
    # 允许的HTTP方法
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    
    # 允许的请求头
    allowed-headers:
      - "*"
    
    # 是否允许携带认证信息（如Cookie）
    # 注意: 设置为true时，allowed-origins不能为"*"
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
    
    # 预检请求的缓存时间（秒）
    max-age: ${CORS_MAX_AGE:3600}

---

# 开发环境配置示例（在IDE或开发环境中设置环境变量）
# CORS_ENABLED=true
# CORS_ALLOWED_ORIGINS=http://localhost:3000
# CORS_ALLOW_CREDENTIALS=false

# 生产环境配置示例（默认值，不需要额外配置）
# CORS_ENABLED=false
# 其他配置项使用默认值即可
