# ========== 日志配置 ==========
logging:
  # 日志级别配置
  level:
    # 根日志级别
    root: ${LOG_LEVEL_ROOT:INFO}
    # 业务包日志级别（默认INFO，需排查时可临时调高）
    com.noah.superagent: ${LOG_LEVEL_BUSINESS:INFO}
    # DAO/SQL日志级别（默认INFO，避免大量SQL DEBUG）
    com.noah.superagent.dao: ${LOG_LEVEL_SQL:INFO}
    # 第三方库日志级别
    org.springframework: ${LOG_LEVEL_SPRING:INFO}
    org.springframework.web: ${LOG_LEVEL_SPRING_WEB:INFO}
    org.springframework.security: ${LOG_LEVEL_SPRING_SECURITY:INFO}
    org.mybatis: ${LOG_LEVEL_MYBATIS:INFO}
    com.mybatisflex: ${LOG_LEVEL_MYBATIS_FLEX:INFO}
    com.alibaba.druid: ${LOG_LEVEL_DRUID:INFO}
    org.flywaydb: ${LOG_LEVEL_FLYWAY:INFO}
    # Spring Boot Flyway 自动配置日志（问题已解决，降级到 INFO）
    org.springframework.boot.autoconfigure.flyway: ${LOG_LEVEL_FLYWAY_AUTO:INFO}
    # Spring Boot配置加载 & 环境装配（默认INFO，排查时可设为TRACE）
    org.springframework.boot.context.config: ${LOG_LEVEL_SPRING_CONFIG:INFO}
    org.springframework.boot.env: ${LOG_LEVEL_SPRING_ENV:INFO}
    # 自动装配条件评估报告（问题已解决，恢复到 INFO）
    org.springframework.boot.autoconfigure.logging.ConditionEvaluationReportLoggingListener: ${LOG_LEVEL_AUTOCONFIG_REPORT:INFO}
    org.springframework.boot.autoconfigure: ${LOG_LEVEL_AUTOCONFIG:INFO}
    # HTTP客户端日志
    org.apache.http: ${LOG_LEVEL_HTTP:INFO}
    # 定时任务日志
    org.springframework.scheduling: ${LOG_LEVEL_SCHEDULING:INFO}
    # 缓存日志
    org.springframework.cache: ${LOG_LEVEL_CACHE:INFO}
  
  # Log4j2配置文件
  config: classpath:log4j2-spring.xml
  
  # 文件路径（供log4j2-spring.xml使用）
  file:
    path: ${LOG_PATH:logs}
  
  # 注册默认的关闭钩子
  register-shutdown-hook: false
  
  # 组配置
  group:
    # 业务日志组
    business: 
      - com.noah.superagent
    # SQL日志组  
    sql:
      - com.noah.superagent.dao
      - com.mybatisflex
    # Web日志组
    web:
      - org.springframework.web
      - org.springframework.security
    # 数据库日志组
    database:
      - com.alibaba.druid
      - org.flywaydb
