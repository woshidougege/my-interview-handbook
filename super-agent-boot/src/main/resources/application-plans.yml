super-agent:
  plans:
    # 全局年付优惠比例
    yearly-discount-rate: 0.17
    
    # 套餐配置列表（按照前端页面实际展示的内容配置）
    subscription-plans:
      # 免费版
      - id: "1"
        name: "免费版"
        code: "FREE"
        description: "适合轻度使用的个人用户"
        # 价格配置（免费版原价为0）
        monthly-original-price: 0
        yearly-original-price: 0
        monthly-discounted-price: 0
        yearly-discounted-price: 0
        monthly-savings: 0
        yearly-savings: 0
        validity-days: 90
        sort-order: 1
        is-recommended: false
        enabled: true
        features:
          - text: "每日可获得***新积分"
            highlight: true
          - text: "访问聊天"
            highlight: false
          - text: "公共数字分身（限时体验）"
            highlight: false
            
      # 基础版
      - id: "2"
        name: "基础版"
        code: "BASIC"
        description: "适合中度使用的专业用户"
        # 价格配置（设置原价，-1表示自动17%优惠计算）
        monthly-original-price: 39      # 月价原价
        yearly-original-price: 468      # 年价原价（39*12）
        monthly-discounted-price: 29    # 月价优惠后（-1=自动17%优惠）
        yearly-discounted-price: -1     # 年价优惠后（-1=自动17%优惠）
        monthly-savings: -1             # 月价优惠金额（-1=自动计算）
        yearly-savings: -1              # 年价优惠金额（-1=自动计算）
        validity-days: 30
        sort-order: 2
        is-recommended: true
        enabled: true
        features:
          - text: "一次性发放1900积分"
            highlight: false
          - text: "每日可获得300新积分"
            highlight: false
          - text: "访问聊天"
            highlight: false
          - text: "公共数字分身"
            highlight: false
          - text: "幻灯片制作"
            highlight: false
          - text: "网站开发"
            highlight: false
          - text: "数据分析"
            highlight: false
          - text: "图片、视频生成"
            highlight: false
            
      # 高级版
      - id: "3"
        name: "高级版"
        code: "PREMIUM" 
        description: "适合重度使用的企业用户"
        # 价格配置（设置原价，-1表示自动17%优惠计算）
        monthly-original-price: 199     # 月价原价
        yearly-original-price: 2388     # 年价原价（199*12）
        monthly-discounted-price: 179    # 月价优惠后（-1=自动17%优惠）
        yearly-discounted-price: -1     # 年价优惠后（-1=自动17%优惠）
        monthly-savings: -1             # 月价优惠金额（-1=自动计算）
        yearly-savings: -1              # 年价优惠金额（-1=自动计算）
        validity-days: 30
        sort-order: 3
        is-recommended: false
        enabled: true
        features:
          - text: "一次性发放1900积分"
            highlight: false
          - text: "每日可获得300新积分"
            highlight: false
          - text: "访问聊天"
            highlight: false
          - text: "专属数字分身"
            highlight: true
          - text: "幻灯片制作"
            highlight: false
          - text: "网站开发"
            highlight: false
          - text: "数据分析"
            highlight: false
          - text: "图片、视频生成"
            highlight: false
          - text: "本机电脑操控"
            highlight: true
            
      # 购买积分套餐
      - id: "100"
        name: "购买积分"
        code: "CREDIT_PACK"
        description: "直接购买永久积分，无订阅期限"
        # 价格配置（积分包无优惠，原价即最终价）
        monthly-original-price: 59      # 月价原价
        yearly-original-price: 59       # 年价原价（一次性购买，无年付概念）
        monthly-discounted-price: 59    # 月价优惠后（无优惠）
        yearly-discounted-price: 59     # 年价优惠后（无优惠）
        monthly-savings: 0              # 月价优惠金额（无优惠）
        yearly-savings: 0               # 年价优惠金额（无优惠）
        credits-amount: 10000           # 积分数量
        validity-days: 0                # 有效期0表示永久有效
        sort-order: 4
        is-recommended: false
        enabled: true
        features:
          - text: "约生成10-14个PPT"
            highlight: false
