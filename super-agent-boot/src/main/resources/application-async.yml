# ========== 异步处理配置 ==========
super-agent:
  async:
    # 通用异步线程池配置
    general:
      # 核心线程数
      core-pool-size: ${ASYNC_GENERAL_CORE_POOL_SIZE:2}
      # 最大线程数
      max-pool-size: ${ASYNC_GENERAL_MAX_POOL_SIZE:6}
      # 队列容量
      queue-capacity: ${ASYNC_GENERAL_QUEUE_CAPACITY:200}
      # 线程存活时间（秒）
      keep-alive-seconds: ${ASYNC_GENERAL_KEEP_ALIVE:60}
      # 线程名前缀
      thread-name-prefix: "async-general-"
      # 等待任务完成时间（秒）
      await-termination-seconds: ${ASYNC_GENERAL_AWAIT_TERMINATION:20}
      # 是否等待任务完成
      wait-for-tasks-to-complete-on-shutdown: ${ASYNC_GENERAL_WAIT_FOR_TASKS:true}
    
    # 支付异步线程池配置
    payment:
      # 核心线程数
      core-pool-size: ${ASYNC_PAYMENT_CORE_POOL_SIZE:1}
      # 最大线程数
      max-pool-size: ${ASYNC_PAYMENT_MAX_POOL_SIZE:3}
      # 队列容量
      queue-capacity: ${ASYNC_PAYMENT_QUEUE_CAPACITY:100}
      # 线程存活时间（秒）
      keep-alive-seconds: ${ASYNC_PAYMENT_KEEP_ALIVE:60}
      # 线程名前缀
      thread-name-prefix: "async-payment-"
      # 等待任务完成时间（秒）
      await-termination-seconds: ${ASYNC_PAYMENT_AWAIT_TERMINATION:30}
      # 是否等待任务完成
      wait-for-tasks-to-complete-on-shutdown: ${ASYNC_PAYMENT_WAIT_FOR_TASKS:true}
    
    # 消息通知异步线程池配置
    notification:
      # 核心线程数
      core-pool-size: ${ASYNC_NOTIFICATION_CORE_POOL_SIZE:1}
      # 最大线程数
      max-pool-size: ${ASYNC_NOTIFICATION_MAX_POOL_SIZE:2}
      # 队列容量
      queue-capacity: ${ASYNC_NOTIFICATION_QUEUE_CAPACITY:50}
      # 线程存活时间（秒）
      keep-alive-seconds: ${ASYNC_NOTIFICATION_KEEP_ALIVE:60}
      # 线程名前缀
      thread-name-prefix: "async-notification-"
      # 等待任务完成时间（秒）
      await-termination-seconds: ${ASYNC_NOTIFICATION_AWAIT_TERMINATION:15}
      # 是否等待任务完成
      wait-for-tasks-to-complete-on-shutdown: ${ASYNC_NOTIFICATION_WAIT_FOR_TASKS:true}
    
    # 数据同步异步线程池配置
    sync:
      # 核心线程数
      core-pool-size: ${ASYNC_SYNC_CORE_POOL_SIZE:1}
      # 最大线程数
      max-pool-size: ${ASYNC_SYNC_MAX_POOL_SIZE:2}
      # 队列容量
      queue-capacity: ${ASYNC_SYNC_QUEUE_CAPACITY:30}
      # 线程存活时间（秒）
      keep-alive-seconds: ${ASYNC_SYNC_KEEP_ALIVE:60}
      # 线程名前缀
      thread-name-prefix: "async-sync-"
      # 等待任务完成时间（秒）
      await-termination-seconds: ${ASYNC_SYNC_AWAIT_TERMINATION:30}
      # 是否等待任务完成
      wait-for-tasks-to-complete-on-shutdown: ${ASYNC_SYNC_WAIT_FOR_TASKS:true}
    
    # 任务调度异步线程池配置
    scheduler:
      # 核心线程数
      core-pool-size: ${ASYNC_SCHEDULER_CORE_POOL_SIZE:2}
      # 最大线程数
      max-pool-size: ${ASYNC_SCHEDULER_MAX_POOL_SIZE:4}
      # 队列容量
      queue-capacity: ${ASYNC_SCHEDULER_QUEUE_CAPACITY:100}
      # 线程存活时间（秒）
      keep-alive-seconds: ${ASYNC_SCHEDULER_KEEP_ALIVE:120}
      # 线程名前缀
      thread-name-prefix: "async-scheduler-"
      # 等待任务完成时间（秒）
      await-termination-seconds: ${ASYNC_SCHEDULER_AWAIT_TERMINATION:60}
      # 是否等待任务完成
      wait-for-tasks-to-complete-on-shutdown: ${ASYNC_SCHEDULER_WAIT_FOR_TASKS:true}

    # AI对话执行异步线程池配置
    ai-chat-execution:
      # 核心线程数
      core-pool-size: ${ASYNC_AI_CHAT_EXECUTION_CORE_POOL_SIZE:10}
      # 最大线程数
      max-pool-size: ${ASYNC_AI_CHAT_EXECUTION_MAX_POOL_SIZE:20}
      # 队列容量
      queue-capacity: ${ASYNC_AI_CHAT_EXECUTION_QUEUE_CAPACITY:500}
      # 线程存活时间（秒）
      keep-alive-seconds: ${ASYNC_AI_CHAT_EXECUTION_KEEP_ALIVE:60}
      # 线程名前缀
      thread-name-prefix: "ai-chat-execution-"
      # 等待任务完成时间（秒）
      await-termination-seconds: ${ASYNC_AI_CHAT_EXECUTION_AWAIT_TERMINATION:30}
      # 是否等待任务完成
      wait-for-tasks-to-complete-on-shutdown: ${ASYNC_AI_CHAT_EXECUTION_WAIT_FOR_TASKS:true}

    # 资源上报异步线程池配置
    resource-report:
      # 核心线程数
      core-pool-size: ${ASYNC_RESOURCE_REPORT_CORE_POOL_SIZE:2}
      # 最大线程数
      max-pool-size: ${ASYNC_RESOURCE_REPORT_MAX_POOL_SIZE:4}
      # 队列容量
      queue-capacity: ${ASYNC_RESOURCE_REPORT_QUEUE_CAPACITY:200}
      # 线程存活时间（秒）
      keep-alive-seconds: ${ASYNC_RESOURCE_REPORT_KEEP_ALIVE:60}
      # 线程名前缀
      thread-name-prefix: "resource-report-"
      # 等待任务完成时间（秒）
      await-termination-seconds: ${ASYNC_RESOURCE_REPORT_AWAIT_TERMINATION:30}
      # 是否等待任务完成
      wait-for-tasks-to-complete-on-shutdown: ${ASYNC_RESOURCE_REPORT_WAIT_FOR_TASKS:true}

# Spring异步配置
spring:
  task:
    execution:
      # 线程池配置
      pool:
        # 核心线程数
        core-size: ${SPRING_TASK_CORE_SIZE:8}
        # 最大线程数
        max-size: ${SPRING_TASK_MAX_SIZE:16}
        # 队列容量
        queue-capacity: ${SPRING_TASK_QUEUE_CAPACITY:1000}
        # 线程存活时间
        keep-alive: ${SPRING_TASK_KEEP_ALIVE:60s}
        # 允许核心线程超时
        allow-core-thread-timeout: ${SPRING_TASK_ALLOW_CORE_THREAD_TIMEOUT:true}
      # 线程名前缀
      thread-name-prefix: "spring-task-"
      # 关闭配置
      shutdown:
        # 等待任务完成
        await-termination: ${SPRING_TASK_AWAIT_TERMINATION:true}
        # 等待时间
        await-termination-period: ${SPRING_TASK_AWAIT_TERMINATION_PERIOD:60s}
    
    scheduling:
      # 调度线程池配置
      pool:
        # 线程池大小
        size: ${SPRING_SCHEDULING_POOL_SIZE:2}
      # 线程名前缀
      thread-name-prefix: "spring-scheduling-"
      # 关闭配置
      shutdown:
        # 等待任务完成
        await-termination: ${SPRING_SCHEDULING_AWAIT_TERMINATION:true}
        # 等待时间
        await-termination-period: ${SPRING_SCHEDULING_AWAIT_TERMINATION_PERIOD:60s}