# SpringDoc OpenAPI 3 配置
springdoc:
  # API文档配置
  api-docs:
    path: /v3/api-docs
    enabled: ${API_DOCS_ENABLED:true}
  # Swagger UI配置
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_UI_ENABLED:true}
  # 扫描配置
  packages-to-scan: com.noah.superagent.controller
  paths-to-match: /api/**
  # 自定义API信息
  info:
    title: ${API_TITLE:Super Agent API 接口文档}
    description: |
      ## 🚀 Super Agent 用户管理和计费平台
      ### 📋 系统功能
      - **用户管理**：用户注册、登录、认证、权限管理
      - **工作空间**：多租户工作空间管理和权限控制  
      - **积分系统**：用户积分充值、消费、余额查询
      - **资源使用**：Token、功能、媒体等资源消费记录
      - **支付系统**：支持微信支付
      - **任务管理**：智能体任务创建和管理
      ### 🔗 相关链接
      - **监控页面**：[Druid监控](http://localhost:8081/super-agent/druid)
      - **项目仓库**：[GitLab](http://192.168.1.222/noah/super-agent.git)
      ### 📞 联系方式
      如有问题请联系开发团队：renxiangpeng@norinaviation.com
    version: ${API_VERSION:1.0.0}
    terms-of-service: ${API_TERMS_OF_SERVICE:}
    contact:
      name: ${API_CONTACT_NAME:开发团队}
      email: ${API_CONTACT_EMAIL:renxiangpeng@norinaviation.com}
      url: ${API_CONTACT_URL:http://192.168.1.222/noah/super-agent.git}
    license:
      name: ${API_LICENSE_NAME:Apache 2.0}
      url: ${API_LICENSE_URL:https://www.apache.org/licenses/LICENSE-2.0}
  # 服务器配置
  servers:
    - url: http://localhost:${server.port:8081}${server.servlet.context-path:/super-agent}
      description: ${API_SERVER_LOCAL_DESC:本地开发环境}
    - url: ${API_SERVER_PROD_URL:https://api.example.com}${server.servlet.context-path:/super-agent}
      description: ${API_SERVER_PROD_DESC:生产环境}
  # 外部文档
  external-docs:
    description: ${API_EXTERNAL_DOCS_DESC:官方文档}
    url: ${API_EXTERNAL_DOCS_URL:https://springdoc.org/}
